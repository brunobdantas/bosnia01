name: Smoke test da apuração

on:
  push:
    paths:
      - "index.html"
      - "uol-*.js"
      - "uol.css"
      - ".github/workflows/tse-diagnostic.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validar vag da parcial de MG
        shell: bash
        run: |
          set -euo pipefail
          u="https://resultados.tse.jus.br/oficial/ele2026/6259/dados/mg/mg-c0007-e006259-u.json"
          ok=0
          for i in $(seq 1 6); do
            if curl -fsS -H "Accept: application/json" --max-time 30 "$u" -o /tmp/mg.json; then
              if node -e "JSON.parse(require('fs').readFileSync('/tmp/mg.json','utf8'))" >/dev/null 2>&1; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"

          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/mg.json','utf8'));
          let seats=0, groups=0;
          for(const cargo of j.carg||[])for(const agr of cargo.agr||[]){
            const v=Number(String(agr.vag??0).replace(',','.'))||0;
            if(v>0){groups++;seats+=v}
          }
          console.log(JSON.stringify({idg:j.idg,sections:j.s?.pstn,tf:j.tf,groupsWithSeats:groups,seats}));
          if(seats<1)throw new Error('TSE não informou vagas parciais em agr.vag para MG');
          NODE

      - name: Aguardar versão publicada
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            url="https://brunobdantas.github.io/bosnia01/?smoke=${GITHUB_SHA}-$i"
            if curl -fsSL --max-time 20 "$url" | grep -q 'content="20261005-chartfix-1"'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Validar renderer dos gráficos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/brunobdantas/bosnia01/${GITHUB_SHA}/uol-ui-2.js" -o /tmp/ui2.js
          grep -q "const xticks=\[" /tmp/ui2.js
          grep -q "sameProgress" /tmp/ui2.js
          ! grep -q "Math.max(.01,xmax-xmin)" /tmp/ui2.js

      - name: Validar eleito se terminasse agora em MG
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          ok=0
          for i in $(seq 1 5); do
            rm -f /tmp/mg /tmp/mg.log
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --enable-logging=stderr --v=0 --dump-dom "https://brunobdantas.github.io/bosnia01/?cargo=assembleia&uf=MG&smoke=${GITHUB_SHA}-$i" > /tmp/mg 2> /tmp/mg.log || true

            if grep -E 'INFO:CONSOLE:.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/mg.log; then
              exit 1
            fi

            if grep -q 'id="sourceStatus">TSE • dados oficiais' /tmp/mg               && ! grep -q 'id="statusFilter" disabled' /tmp/mg               && grep -q 'value="current-elected"' /tmp/mg               && grep -q 'Eleito se terminasse agora' /tmp/mg               && grep -q 'status-chip current-elected' /tmp/mg               && grep -q 'class="definition-banner partial"' /tmp/mg; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "Smoke da parcial proporcional de MG aprovado."
