name: Diagnóstico TSE

on:
  push:
    paths:
      - ".github/workflows/tse-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Testar endpoints oficiais e CORS
        shell: bash
        run: |
          set -euo pipefail
          u="https://resultados.tse.jus.br/oficial/ele2026/6257/dados/br/br-c0001-e006257-u.json"
          echo "==== $u"
          curl -sS -H "Origin: https://brunobdantas.github.io" -D /tmp/headers -o /tmp/body --max-time 20 "$u"
          cat /tmp/headers
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/body','utf8'));
          let count=0;
          for(const cargo of j.carg||[])for(const agr of cargo.agr||[])for(const par of agr.par||[])count+=(par.cand||[]).length;
          console.log(JSON.stringify({dg:j.dg,hg:j.hg,idg:j.idg,sections:j.s,valid:j.v?.vv,candidates:count}));
          NODE

      - name: Executar portal em Chrome headless
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "chrome=$chrome"
          if [ -z "$chrome" ]; then
            echo "CHROME_NOT_FOUND"
            exit 0
          fi
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --enable-logging=stderr --v=0 --dump-dom "https://brunobdantas.github.io/bosnia01/?diag=$(date +%s)" > /tmp/dom 2> /tmp/chrome.log || true
          echo "---- console/runtime ----"
          grep -E "ERROR|Uncaught|ReferenceError|TypeError|SyntaxError|Failed to load|Access to fetch" /tmp/chrome.log | head -n 100 || true
          echo "---- rendered status ----"
          grep -o 'id="sourceStatus"[^>]*>[^<]*' /tmp/dom | head -n 5 || true
          grep -o 'class="notice[^"]*"[^>]*>[^<]*' /tmp/dom | head -n 5 || true
          echo "candidate rows: $(grep -c 'class="candidate-row' /tmp/dom || true)"
          grep -o 'class="candidate-info-top"[^>]*><strong>[^<]*' /tmp/dom | head -n 5 || true
          echo "---- body markers ----"
          grep -E "99[,\.]|dados oficiais|reconectando|aguardando" /tmp/dom | head -n 20 || true
