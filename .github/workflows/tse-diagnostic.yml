name: Smoke test da apuração

on:
  push:
    paths:
      - "index.html"
      - "uol-*.js"
      - "uol.css"
      - ".github/workflows/tse-diagnostic.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar versão publicada
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            url="https://brunobdantas.github.io/bosnia01/?smoke=${GITHUB_SHA}-$i"
            if curl -fsSL --max-time 20 "$url" | grep -q 'content="20261005-statusavailability-1"'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Validar MG sem situação oficial e DF com situação
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"

          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --enable-logging=stderr --v=0 --dump-dom "https://brunobdantas.github.io/bosnia01/?cargo=assembleia&uf=MG&smoke=${GITHUB_SHA}" > /tmp/mg 2> /tmp/mg.log || true
          ! grep -E 'INFO:CONSOLE:.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/mg.log
          grep -q 'id="sourceStatus">TSE • dados oficiais' /tmp/mg
          grep -q 'id="statusFilter" disabled' /tmp/mg
          grep -q 'Aguardando definição oficial do TSE' /tmp/mg
          grep -q 'Situação oficial ainda não publicada pelo TSE' /tmp/mg

          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --enable-logging=stderr --v=0 --dump-dom "https://brunobdantas.github.io/bosnia01/?cargo=assembleia&uf=DF&smoke=${GITHUB_SHA}" > /tmp/df 2> /tmp/df.log || true
          ! grep -E 'INFO:CONSOLE:.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/df.log
          grep -q 'id="sourceStatus">TSE • dados oficiais' /tmp/df
          ! grep -q 'id="statusFilter" disabled' /tmp/df
          grep -q 'value="elected"' /tmp/df
          grep -q 'value="alternate"' /tmp/df

          echo "Smoke MG/DF aprovado."
