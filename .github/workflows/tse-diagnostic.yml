name: Smoke test da apuração

on:
  push:
    paths:
      - "index.html"
      - "uol-*.js"
      - "uol.css"
      - ".github/workflows/tse-diagnostic.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validar vag da parcial de MG
        shell: bash
        run: |
          set -euo pipefail
          u="https://resultados.tse.jus.br/oficial/ele2026/6259/dados/mg/mg-c0007-e006259-u.json"
          curl -sS --max-time 30 "$u" -o /tmp/mg.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/mg.json','utf8'));
          let seats=0, groups=0;
          for(const cargo of j.carg||[])for(const agr of cargo.agr||[]){
            const v=Number(String(agr.vag??0).replace(',','.'))||0;
            if(v>0){groups++;seats+=v}
          }
          console.log(JSON.stringify({idg:j.idg,sections:j.s?.pstn,tf:j.tf,groupsWithSeats:groups,seats}));
          if(seats<1)throw new Error('TSE não informou vagas parciais em agr.vag para MG');
          NODE

      - name: Aguardar versão publicada
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            url="https://brunobdantas.github.io/bosnia01/?smoke=${GITHUB_SHA}-$i"
            if curl -fsSL --max-time 20 "$url" | grep -q 'content="20261005-currentelected-1"'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Validar eleito se terminasse agora em MG
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --enable-logging=stderr --v=0 --dump-dom "https://brunobdantas.github.io/bosnia01/?cargo=assembleia&uf=MG&smoke=${GITHUB_SHA}" > /tmp/mg 2> /tmp/mg.log || true

          ! grep -E 'INFO:CONSOLE:.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/mg.log
          grep -q 'id="sourceStatus">TSE • dados oficiais' /tmp/mg
          ! grep -q 'id="statusFilter" disabled' /tmp/mg
          grep -q 'value="current-elected"' /tmp/mg
          grep -q 'Eleito se terminasse agora' /tmp/mg
          grep -q 'status-chip current-elected' /tmp/mg
          grep -q 'class="definition-banner partial"' /tmp/mg
grep -q 'id="definitionBanner"' /tmp/mg

          echo "Smoke da parcial proporcional de MG aprovado."
