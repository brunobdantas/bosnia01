name: Smoke test Eleição 360 limpa

on:
  push:
    paths:
      - "index.html"
      - "uol-*.js"
      - "uol.css"
      - "experience.js"
      - "experience.css"
      - ".github/workflows/tse-diagnostic.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validar sintaxe
        shell: bash
        run: |
          set -euo pipefail
          for f in uol-core.js uol-ui-1.js uol-ui-2.js uol-ui-3.js uol-runtime.js experience.js; do
            curl -fsSL "https://raw.githubusercontent.com/brunobdantas/bosnia01/${GITHUB_SHA}/$f" -o "/tmp/$f"
          done
          cat /tmp/uol-core.js /tmp/uol-ui-1.js /tmp/uol-ui-2.js /tmp/uol-ui-3.js /tmp/uol-runtime.js /tmp/experience.js > /tmp/all.js
          node -e "new Function(require('fs').readFileSync('/tmp/all.js','utf8')); console.log('syntax-ok')"

      - name: Aguardar publicação
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            url="https://brunobdantas.github.io/bosnia01/?smoke=${GITHUB_SHA}-$i"
            if curl -fsSL --max-time 20 "$url" | grep -q 'content="20261005-clean-1"'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Validar home limpa em Chrome real
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          ok=0
          for i in $(seq 1 5); do
            rm -f /tmp/dom /tmp/chrome.log
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --enable-logging=stderr --v=0 --dump-dom "https://brunobdantas.github.io/bosnia01/?smoke=${GITHUB_SHA}-$i" > /tmp/dom 2> /tmp/chrome.log || true

            if grep -E 'INFO:CONSOLE:.*(Uncaught|ReferenceError|TypeError|SyntaxError)' /tmp/chrome.log; then
              exit 1
            fi

            races="$(grep -o 'class="e360-race-row"' /tmp/dom | wc -l | tr -d ' ')"
            seats="$(grep -o 'class="e360-seat-card"' /tmp/dom | wc -l | tr -d ' ')"

            if grep -q 'id="expHeroProgress"' /tmp/dom               && ! grep -q 'id="expHeroProgress">—' /tmp/dom               && test "$races" = "4"               && test "$seats" = "2"               && grep -q 'class="e360-segment"' /tmp/dom               && grep -q 'id="expOpenExplorer"' /tmp/dom               && grep -q 'id="expShareButton"' /tmp/dom               && ! grep -q 'PASSAPORTE ELEITORAL' /tmp/dom               && ! grep -q 'Modo TV' /tmp/dom               && ! grep -q 'DESCUBRA A ELEIÇÃO' /tmp/dom; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "Smoke da home limpa aprovado."
